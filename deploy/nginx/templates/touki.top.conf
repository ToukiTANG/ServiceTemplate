# =============================================================================
# Nginx · touki.top（正式配置，证书就位后使用）
# -----------------------------------------------------------------------------
# 和首次配置的区别：80 端口只留证书验证 + 301 跳转，真正的服务在 443。
# =============================================================================

# ---- 80：只做证书验证和跳转 ----
server {
    listen 80;
    server_name touki.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：静态文件 + API 反代 ----
server {
    listen 443 ssl;
    # nginx 1.25.1 起用独立指令，旧的 listen 443 ssl http2 已废弃
    http2 on;
    server_name touki.top;

    ssl_certificate     /etc/letsencrypt/live/touki.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touki.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由兜底：少了这行，刷新 /transfer/abc123 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物带内容 hash，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口。文件本身走又拍云直传，这里的请求都是 JSON，很小
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出类接口可能稍慢，留 60s（默认 60s 也够，写出来是为了显式）
        proxy_read_timeout 60s;
    }

    # 基础安全头。nosniff 和下载防护那条是配套的：
    # 后端下载接口已经返回 octet-stream，这里再兜一层
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 3-4 Mbps 带宽下 gzip 很关键：前端产物 719KB → 传输约 200KB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
}
