# =============================================================================
# Nginx · touki.top（首次申请证书时用）
# -----------------------------------------------------------------------------
# 为什么单独一份：第一次启动时证书还不存在，如果配置里写了 443 + ssl_certificate，
# nginx 会因为找不到证书文件直接启动失败，连 80 都起不来，证书也申请不了。
#
# 流程：
#   1. 先用这份配置启动 nginx
#   2. certbot 申请证书
#   3. 换成 touki.top.conf（含 443）后 restart
# =============================================================================

server {
    listen 80;
    server_name touki.top;

    # Let's Encrypt 的验证文件走这个目录（certbot 容器写的，这里只读）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由兜底：直接访问 /transfer 这类路径时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
